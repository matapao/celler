# The owner's style, on every push and pull request: pnpm lint:style (no nested ternaries or explicit any, and
# Prettier). It reports only until the code is formatted, then joins Test as a step, as pnpm lint and check:lines have.
# Holds no secrets.

name: Lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  style:
    name: Style (reports only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # pnpm at the version packageManager in package.json names, by Node's own corepack.
      - run: corepack enable pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:style
