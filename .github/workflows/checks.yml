name: Checks
# `pnpm check --coverage`, the one gate (scripts/check.mjs: the typecheck, the lint, Prettier, the repository's files
# and every test with its coverage floors), on Linux and on macOS, whose agents' sandboxes and folders' names differ;
# the tests again on Node 24, the floor package.json's engines keep for Electron's Node; and the package as npm gets
# it. Every push to main and pull request, and before a release (publish.yml calls it). Holds no secrets. The job
# named Checks, last, is the one check main requires: it passes only when every other job did.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
# A newer push to the same branch or pull request stops the run before it. The group is named, not github.workflow,
# which is publish.yml's own when it calls this one.
concurrency:
  group: checks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm at the version packageManager in package.json names.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm check --coverage

  node-24:
    name: Test on Node 24
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3' # Electron 45's
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  package:
    name: Package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      # publint and attw: the package as npm would get it.
      - run: pnpm check:package

  checks:
    name: Checks
    if: always()
    needs: [check, node-24, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every other job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "Not every job passed: $RESULTS"
              exit 1
            fi
          done
          echo "Every job passed."
