# Supply chain: a release installs once it is a week old (Dependabot waits as long), never with weaker provenance than
# the one before it, and only from the registry. No dependency here runs an install script: one that does fails the
# install (strictDepBuilds) until it is named under allowBuilds, true or false.
minimumReleaseAge: 10080
# These versions were in the lockfile before the week's wait came in (2026-11-24); each has waited it out by
# 2026-11-27, when this list goes. Only these exact versions: a newer one still waits.
minimumReleaseAgeExclude:
  - '@anthropic-ai/claude-agent-sdk@0.3.330'
  - '@anthropic-ai/sdk@1.12.0'
  - '@babel/runtime@7.29.15'
  - '@hono/node-server@2.1.9'
  - '@openai/codex-sdk@0.171.0'
  - '@openai/codex@0.171.0'
  - 'router@2.3.0'
  - 'standardwebhooks@1.3.0'
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200
blockExoticSubdeps: true
strictDepBuilds: true
allowBuilds:
  # Its script only checks the program its own platform's package brings, which it runs from there as it is.
  esbuild: false
# pnpm 12 otherwise writes the lockfile as two YAML documents, pnpm's own first, and GitHub's dependency graph,
# Dependabot alerts and OSV-Scanner then read only pnpm (tested: 16 packages of 304). pnpm still switches to
# packageManager's version, and engines.pnpm stops pnpm 11. The lockfile stays one document: check:security holds it.
pmOnFail: ignore

# The agent SDKs' bundled copies of Claude Code and Codex: celler runs the person's own (harness/programs.ts), so none is
# installed.
ignoredOptionalDependencies:
  - '@anthropic-ai/claude-agent-sdk-*'
  - '@openai/codex-*'
# The Codex SDK writes its prompt to Codex with no listener for the pipe's errors: a Codex that ends before it reads a
# long prompt would end the host. The patch adds the listener, and nothing else.
patchedDependencies:
  '@openai/codex-sdk@0.171.0': patches/@openai__codex-sdk@0.171.0.patch
